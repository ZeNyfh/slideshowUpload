<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Slideshow</title>
  <link rel="stylesheet" href="/static/style.css?v={{ boot_id }}" />
</head>
<body class="view-page" data-boot-id="{{ boot_id }}">
  <div class="stage" id="stage">
    <p class="empty" id="empty">Waiting for images…</p>
    <div class="fx" id="fx"></div>
  </div>
  <div class="badge" id="badge">New</div>
  <div class="qr-float" id="qr" hidden></div>
  <div class="view-controls" id="controls" role="toolbar" aria-label="Slideshow controls">
    <button type="button" class="vc-btn" id="prevBtn" title="Previous photo" aria-label="Previous photo">‹</button>
    <button type="button" class="vc-btn" id="nextBtn" title="Next photo" aria-label="Next photo">›</button>
    <button type="button" class="vc-btn" id="downloadBtn" title="Download this photo" aria-label="Download this photo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v8.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4L11 12.6V4a1 1 0 0 1 1-1zM5 19h14a1 1 0 1 1 0 2H5a1 1 0 1 1 0-2z"/></svg></button>
    <button type="button" class="vc-btn" id="galleryBtn" title="View all photos" aria-label="View all photos in a gallery"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 3h7v7H3V3zm11 0h7v7h-7V3zM3 14h7v7H3v-7zm11 0h7v7h-7v-7z"/></svg></button>
    <button type="button" class="vc-btn" id="fullscreenBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg></button>
    <button type="button" class="vc-btn" id="cogBtn" title="Display settings" aria-label="Display settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="settings-panel" id="settingsPanel" hidden>
    <div class="settings-head">
      <span>Display settings</span>
      <button type="button" class="g-btn g-btn-close" id="settingsCloseBtn" aria-label="Close settings">✕</button>
    </div>
    <p class="muted">These only affect this screen — no one else sees them.</p>
    <label class="settings-row">
      <span>Seconds per photo</span>
      <input type="range" id="settingsDuration" min="1" max="60" step="1" />
      <input type="number" id="settingsDurationNum" min="1" max="60" step="1" value="5" aria-label="Seconds per photo" />
    </label>
    <button type="button" class="g-btn" id="settingsResetBtn">Reset to default</button>
  </div>
  <div class="gallery" id="galleryOverlay" hidden>
    <header class="gallery-head">
      <div class="gallery-title">
        <h2>Photos <span class="muted" id="galleryTotal"></span></h2>
        <p class="gallery-hint">Select photos to download.</p>
      </div>
      <div class="gallery-head-actions">
        <button type="button" class="g-btn" id="galleryDownloadAllBtn">Download all</button>
        <button type="button" class="g-btn g-btn-primary" id="galleryDoneBtn"><span class="done-full">← Back to slideshow</span><span class="done-short">Done</span></button>
      </div>
    </header>
    <div class="gallery-grid" id="galleryGrid"></div>
    <footer class="gallery-foot">
      <button type="button" class="g-btn" id="gallerySelectAllBtn">Select all</button>
      <span class="gallery-count" id="galleryCount">0 selected</span>
      <button type="button" class="g-btn g-btn-primary" id="galleryDownloadBtn" disabled>Download selected</button>
    </footer>
  </div>
  <div class="gallery-lightbox" id="galleryLightbox" hidden>
    <div class="lightbox-top">
      <button type="button" class="g-btn" id="lightboxBackBtn">← All photos</button>
      <button type="button" class="g-btn g-btn-close" id="lightboxCloseBtn" aria-label="Close">✕</button>
    </div>
    <img id="lightboxImg" alt="" />
    <div class="lightbox-actions">
      <button type="button" class="g-btn g-btn-primary" id="lightboxDownloadBtn">Download photo</button>
    </div>
  </div>
  <script src="/static/vendor/qrcode.js?v={{ boot_id }}"></script>
  <script src="/static/qr.js?v={{ boot_id }}"></script>
  <script src="/static/view.js?v={{ boot_id }}"></script>
</body>
</html>
