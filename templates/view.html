<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Slideshow</title>
  <link rel="stylesheet" href="/static/style.css?v={{ boot_id }}" />
</head>
<body class="view-page" data-boot-id="{{ boot_id }}">
  <div class="stage" id="stage">
    <p class="empty" id="empty">Waiting for images…</p>
    <div class="fx" id="fx"></div>
  </div>
  <div class="badge" id="badge">New</div>
  <div class="qr-float" id="qr" hidden></div>
  <div class="view-controls" id="controls" role="toolbar" aria-label="Slideshow controls">
    <button type="button" class="vc-btn" id="prevBtn" title="Previous photo" aria-label="Previous photo">‹</button>
    <button type="button" class="vc-btn" id="downloadBtn" title="Download this photo" aria-label="Download this photo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v8.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4L11 12.6V4a1 1 0 0 1 1-1zM5 19h14a1 1 0 1 1 0 2H5a1 1 0 1 1 0-2z"/></svg></button>
    <button type="button" class="vc-btn" id="downloadAllBtn" title="Download all photos (zip)" aria-label="Download all photos as zip"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 3h16a1 1 0 0 1 1 1v3H3V4a1 1 0 0 1 1-1zM3 9h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9zm9 2l3 3h-2v3h-2v-3H9l3-3z"/></svg></button>
    <button type="button" class="vc-btn" id="fullscreenBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg></button>
    <button type="button" class="vc-btn" id="playBtn" title="Resume slideshow" aria-label="Resume slideshow" hidden>▶</button>
    <button type="button" class="vc-btn" id="nextBtn" title="Next photo" aria-label="Next photo">›</button>
  </div>
  <script src="/static/vendor/qrcode.js?v={{ boot_id }}"></script>
  <script src="/static/qr.js?v={{ boot_id }}"></script>
  <script src="/static/view.js?v={{ boot_id }}"></script>
</body>
</html>
