<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>Upload photos</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="upload-page">
  <main class="upload-shell">
    <h1>Welcome to the 271 Halloween Photo Share!</h1>

    <section class="name-bar" id="nameBar">
      <label class="field" for="nameInput">
        Your name
        <input
          type="text"
          id="nameInput"
          name="name"
          maxlength="40"
          autocomplete="nickname"
          placeholder="Enter your name"
          required
        />
      </label>
      <button type="button" class="btn btn-secondary" id="saveNameBtn">Save name</button>
      <p class="status" id="nameStatus" aria-live="polite"></p>
    </section>

    <div id="uploadArea" class="upload-area is-locked" hidden>
      <p class="intro">Send as many photos as you like. New uploads show up first.</p>
      <p class="greeting" id="greeting">
        <span>Uploading as <strong id="greetingName"></strong></span>
        <button type="button" class="link-btn" id="changeNameBtn">Change</button>
      </p>

      <div class="preview" id="preview">
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <div class="webcam" id="webcamPanel" hidden>
        <video id="webcamVideo" autoplay playsinline muted></video>
        <div class="webcam-actions">
          <button type="button" class="btn btn-primary" id="webcamCaptureBtn">Capture</button>
          <button type="button" class="btn btn-secondary" id="webcamCancelBtn">Cancel</button>
        </div>
      </div>

      <div class="actions" id="uploadActions">
        <button type="button" class="btn btn-primary" id="cameraBtn">Take a picture</button>
        <button type="button" class="btn btn-secondary" id="fileBtn">Upload images</button>
        <button type="button" class="btn btn-primary" id="sendBtn" hidden>Send to slideshow</button>
      </div>

      <p class="status" id="status" aria-live="polite"></p>
    </div>

    <p class="status" id="gateMsg">Enter your name above to unlock uploading.</p>

    <input
      class="hidden-input"
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
    />
    <input
      class="hidden-input"
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    />
  </main>
  <script src="/static/upload.js"></script>
</body>
</html>
